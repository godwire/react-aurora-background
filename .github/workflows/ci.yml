name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install library dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Install example dependencies
        run: npm install
        working-directory: example

      - name: Build example
        run: npm run build
        working-directory: example
